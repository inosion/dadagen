[workspace]
members = [
    "dadagen-core",
    "dadagen-macros", 
    "dadagen-gui",
    "dadagen-web",
    "dadagen-python",
    "dadagen-cli"
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
csv = "1.3"
lazy_static = "1.4"
pest = "2.7"
pest_derive = "2.8"
petgraph = "0.6"
rand = "0.8"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3.8"
xdg = "2.5"
thiserror = "1.0"
tracing = "0.1"

# CLI dependencies
clap = { version = "4.0", features = ["derive"] }
tracing-subscriber = "0.3"

# Procedural macro dependencies
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

# GUI dependencies
tauri = { version = "1.0", features = ["cli", "shell-open", "system-tray"] }
serde_json = "1.0"

# WASM dependencies
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"

# Python extension dependencies
pyo3 = { version = "0.20", features = ["extension-module"] }

# Testing dependencies
proptest = "1.0"
criterion = "0.5"


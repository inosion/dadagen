# Rustfmt configuration for dadagen project
# See https://rust-lang.github.io/rustfmt/

edition = "2021"

# Maximum width of each line
max_width = 100

# Maximum width of the args of a function call before falling back to vertical formatting
fn_call_width = 80

# Maximum width of the args of a function-like attributes before falling back to vertical formatting
attr_fn_like_width = 80

# Maximum width in the body of a struct lit before falling back to vertical formatting
struct_lit_width = 80

# Maximum width in the body of a struct variant before falling back to vertical formatting
struct_variant_width = 80

# Maximum width of an array literal before falling back to vertical formatting
array_width = 80

# Maximum width of a chain to fit on a single line
chain_width = 80

# Maximum length of single line before fallback to new line
single_line_if_else_max_width = 80

# Brace style for items
brace_style = "SameLineWhere"

# Brace style for control flow constructs
control_brace_style = "AlwaysSameLine"

# Indentation style
indent_style = "Block"

# How to place a list-like items
trailing_comma = "Vertical"

# Allow trailing semicolon in expressions
trailing_semicolon = true

# Format string literals
format_strings = true

# Format code in doc comments
format_code_in_doc_comments = true

# Format generated files
format_generated_files = true

# Merge imports
imports_granularity = "Crate"

# Group imports
group_imports = "StdExternalCrate"

# Reorder imports
reorder_imports = true

# Reorder modules
reorder_modules = true

# Use field init shorthand if possible
use_field_init_shorthand = true

# Use try shorthand
use_try_shorthand = true

# Force explicit types for fn calls
force_explicit_abi = true

# Normalize comments
normalize_comments = true

# Normalize doc attributes
normalize_doc_attributes = true

# Wrap comments at max_width
wrap_comments = true

# Error on line overflow
error_on_line_overflow = false

# Error on unformatted code
error_on_unformatted = false

# Format macro bodies
format_macro_bodies = true

# Format macro matchers
format_macro_matchers = true

# Combine control expressions with function calls
combine_control_expr = true

# Overflow delimited expressions
overflow_delimited_expr = false

# Use small heuristics
use_small_heuristics = "Default"

# Short array element width threshold
short_array_element_width_threshold = 10

# Blank lines upper bound
blank_lines_upper_bound = 1

# Blank lines lower bound
blank_lines_lower_bound = 0

# Enum variant width threshold
enum_discrim_align_threshold = 0

# Match arm blocks
match_block_trailing_comma = false

# Match arm leading pipes
match_arm_leading_pipes = "Never"

# Force multiline blocks
force_multiline_blocks = false

# Condense wildcard suffixes
condense_wildcard_suffixes = false

# Edition formatting rules
edition = "2021"

# Version sorting
version = "Two"

# Inline attribute width
inline_attribute_width = 0

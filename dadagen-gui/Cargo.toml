[package]
name = "dadagen-gui"
version = "0.1.0"
edition = "2024"
description = "Cross-platform GUI application for dadagen"

[[bin]]
name = "dadagen-gui"
path = "src/main.rs"

[dependencies]
dadagen-core = { path = "../dadagen-core" }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
rfd = { workspace = true }  # Native file dialogs
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = "0.4"
open = "5.0"  # Open URLs in default browser
csv = "1.3"  # CSV parsing
calamine = "0.24"  # Excel parsing
